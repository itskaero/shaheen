services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shaheen
      POSTGRES_PASSWORD: shaheen
      POSTGRES_DB: shaheen
    volumes:
      - shaheen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaheen"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  shaheen_db_data:
