# Builds the app image (bot, API and migrations share it) and publishes it to
# GitHub Container Registry, where the NAS pulls it (docs/DEPLOY_NAS.md,
# docs/DECISIONS.md ADR-127). The image holds no secrets: everything comes
# from the NAS's .env at run time. Make the package public once (Package
# settings -> Change visibility) so the NAS can pull without logging in.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for Intel/AMD NAS boxes (ZimaBoard, ZimaCube), arm64 in case
      # it ever moves to an ARM board.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
