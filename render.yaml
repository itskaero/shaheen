# Render Blueprint — free-tier hosting for the Shaheen website API.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# See README.md's "Deploying the website" section for the full walkthrough,
# and docs/DECISIONS.md ADR-044 for why Render was chosen.
#
# Note (free tier): the web service sleeps after 15 minutes idle (first
# request after that takes ~30-60s to wake it), and the free Postgres
# database expires 90 days after creation unless upgraded.

databases:
  - name: shaheen-db
    plan: free
    databaseName: shaheen
    user: shaheen

services:
  - type: web
    name: shaheen-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uv run uvicorn api.app:app --app-dir src --host 0.0.0.0 --port $PORT
    preDeployCommand: uv run alembic upgrade head
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaheen-db
          property: connectionString
      # Set these in the Render dashboard after the first deploy (never
      # commit real values) — the API process doesn't use either at
      # runtime (docs/DECISIONS.md ADR-041), but Settings still requires
      # them to be present.
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: BRAWLHALLA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
