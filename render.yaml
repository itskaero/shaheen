# Render Blueprint — free-tier hosting for the Shaheen website API.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# See README.md's "Deploying to production" section for the full
# walkthrough, and docs/DECISIONS.md ADR-044 for why Render was chosen.
#
# Note (free tier): the web service sleeps after 15 minutes idle (first
# request after that takes ~30-60s to wake it), and the free Postgres
# database expires 90 days after creation unless upgraded. Free-tier
# services also can't use Render's preDeployCommand (paid-plan only), so
# migrations run at boot instead, via scripts/render-start.sh, before
# uvicorn starts — see docs/DECISIONS.md ADR-054. `alembic upgrade head`
# is a no-op once already at head, so re-running it on every boot (every
# wake from sleep included) is safe, just an extra few hundred ms.
#
# dockerCommand is a plain script path, not an inline `cmd1 && cmd2`
# string — Render's dockerCommand field does not reliably shell-tokenize
# an inline command chain (see ADR-054), so the chain lives in the script
# instead, where there's nothing for Render's own parsing to mangle.

databases:
  - name: shaheen-db
    plan: free
    databaseName: shaheen
    user: shaheen

services:
  - type: web
    name: shaheen-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/render-start.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaheen-db
          property: connectionString
      # Set these in the Render dashboard after the first deploy (never
      # commit real values) — the API process doesn't use either at
      # runtime (docs/DECISIONS.md ADR-041), but Settings still requires
      # them to be present.
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: BRAWLHALLA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
