<body class="bl music-page" data-page="anthem">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- The night loop, sharp and full-bleed, locked to the music's tempo (ADR-119). -->
  <div class="music-bg" aria-hidden="true">
    <video id="music-video" muted loop playsinline preload="auto" poster="assets/video/music-loop-poster.jpg"></video>
    <div class="music-flash"></div>
    <div class="music-veil"></div>
  </div>

  <header class="music-top">
    <nav class="music-top-links" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="rankings.html">Rankings</a>
      <a href="teams.html">Teams</a>
      <a href="seasons.html">Seasons</a>
    </nav>
    <a class="music-top-mark" href="index.html" aria-label="BRAWLISTAN home">
      <img src="assets/img/brawlistan/mark.webp" alt="" width="64" height="64" />
    </a>
    <div class="music-top-icons">
      <a data-discord-invite href="join.html" target="_blank" rel="noopener" aria-label="BRAWLISTAN Discord">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.6 5.3A16.4 16.4 0 0 0 15.5 4l-.5 1a15 15 0 0 0-6 0l-.5-1a16.4 16.4 0 0 0-4.1 1.3C1.8 9.2 1.1 13 1.4 16.7a16.6 16.6 0 0 0 5 2.5l1.1-1.7c-.6-.2-1.2-.5-1.7-.8l.4-.3a11.8 11.8 0 0 0 11.6 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.7a16.5 16.5 0 0 0 5-2.5c.4-4.3-.6-8-2.6-11.4ZM8.5 14.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
      </a>
      <a href="https://github.com/itskaero/shaheen" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.8-.3 2.8 1a9.6 9.6 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="music-stage" aria-label="Now playing">
      <span class="music-line music-line-top" aria-hidden="true"></span>
      <div class="music-heading">
        <p class="music-eyebrow"><span id="music-state">Music</span> <span aria-hidden="true">·</span> <span id="music-bpm">— BPM</span></p>
        <h1 class="music-title" id="music-title">Brawlistan</h1>
        <p class="music-urdu" id="music-urdu" lang="ur"></p>
      </div>
      <span class="music-line music-line-bottom" aria-hidden="true"></span>

      <div class="music-foot">
        <p class="music-desc" id="music-desc">The sound of BRAWLISTAN. Press play — the night moves with every beat.</p>
        <div class="music-seek">
          <span class="music-time" id="music-current">0:00</span>
          <input type="range" id="music-progress" class="music-range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          <span class="music-time" id="music-duration">0:00</span>
        </div>
        <div class="music-actions">
          <button type="button" class="music-cta music-cta-glass" id="music-tracks-btn">Choose track</button>
          <button type="button" class="music-cta music-cta-light" id="music-play" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
            <span class="music-play-label">Play</span>
          </button>
        </div>
      </div>
    </section>

    <section class="music-picker" id="music-picker" aria-labelledby="picker-title">
      <div class="music-picker-head">
        <h2 id="picker-title">Choose a track</h2>
        <p>Originals from BRAWLISTAN, and the anthems of SHAHEEN, its founding team.</p>
      </div>
      <ol class="music-covers" id="music-covers"></ol>
      <h3 class="music-shelf-title">From SHAHEEN</h3>
      <ol class="music-shelf" id="music-shelf"></ol>
    </section>
  </main>

  <nav class="bl-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/pages/music.js"></script>
</body>
</html>
