<!doctype html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    /* GitHub Pages serves this file for any missing path, at any depth, so
       relative asset links need a <base> at the site root: the first path
       segment on a *.github.io project site, "/" anywhere else.
       A /player/<slug>/ page that hasn't been generated yet (new players
       get one on the next 6-hourly snapshot, docs/DECISIONS.md ADR-106)
       goes straight to the live profile instead of a dead end. */
    (function () {
      var parts = location.pathname.split("/");
      var root = /\.github\.io$/.test(location.hostname) && parts[1] ? "/" + parts[1] + "/" : "/";
      document.write('<base href="' + root + '" />');
      var match = location.pathname.match(/\/player\/([a-z0-9-]{1,64})\/?$/);
      if (match) location.replace(root + "player.html?p=" + match[1]);
    })();
  </script>
